modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/MjKey/VRPhys/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/MjKey/VRPhys"
authors="MjKey"
description='''
VRPhys lets VR players physically grab, drag, and throw Sable sub-level constructions.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sable"
    type="required"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="vivecraft"
    type="optional"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="immersivemc"
    type="optional"
    ordering="AFTER"
    side="BOTH"
